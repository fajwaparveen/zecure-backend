<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Viewer</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% extends 'expert/home_index.html' %}
{% block body %}

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body text-center">
            <img src="{{ data.photo }}" height="100" width="100" class="rounded-circle mb-3" alt="Profile Photo">
            <h4 class="card-title">{{ data.name }}</h4>
            <p class="text-muted">{{ data.qualification }}</p>
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>Email ID:</strong>{{ data.emailid}}</li>
            <li class="list-group-item"><strong>Date of Birth:</strong> {{ data.phonenumber }}</li>
            <li class="list-group-item"><strong>Place:</strong> {{ data.place }}</li>
            <li class="list-group-item"><strong>Post:</strong> {{ data.post }}</li>
            <li class="list-group-item"><strong>PIN Code:</strong> {{ data.pincode }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% endblock %}

</body>
</html>
