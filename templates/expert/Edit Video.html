<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Video</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                 <h2 class="text-center">Add Video</h2>

                <form method="post" action="/MyApp/expert_editvideo_post/">
                    {% csrf_token %}
                    <input type="hidden" value="{{ data.id }}" name="id">
                    <div class="form-group">
                        <label for="username">Title</label>
                        <input type="text" class="form-control" value="{{ data.title }}" id="username"name="title" placeholder="Title" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Video</label>
                        <video src="{{ data.video }}" controls height="100" width="110"></video>
                        <input type="File" class="form-control"  id="password"name="video" placeholder="" >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Submit</button>
                </form>

            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
