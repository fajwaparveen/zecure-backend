<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDPS Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Cute Security Style -->
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 🔐 Security-related wallpaper (replace with your own static path if needed) */
            background-image: url('/static/ad/img/security-wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Dark overlay to make text readable */
        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, rgba(0, 255, 204, 0.2), transparent 40%),
                        rgba(5, 10, 25, 0.85);
            z-index: 1;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px 28px 26px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #f5f7ff;
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            text-align: center;
            color: #c5c9f5;
            margin-bottom: 20px;
        }

        .security-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f5ff, #007bff);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 0 18px rgba(0, 245, 255, 0.7);
        }

        .security-icon i {
            color: #0b1020;
            font-size: 26px;
        }

        label {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .form-control {
            background: rgba(4, 10, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: #f5f7ff;
            font-size: 14px;
        }

        .form-control::placeholder {
            color: #9ea3d1;
        }

        .form-control:focus {
            background: rgba(8, 16, 46, 0.9);
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(0, 225, 255, 0.25);
        }

        .btn-login {
            border-radius: 999px;
            background: linear-gradient(135deg, #007bff, #00e5ff);
            border: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 12px 24px rgba(0, 150, 255, 0.4);
        }

        .btn-login:hover {
            filter: brightness(1.08);
        }

        .forgot-link a {
            font-size: 13px;
            color: #c5c9ff;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .tiny-note {
            font-size: 11px;
            color: #9ea3d1;
            text-align: center;
            margin-top: 8px;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 24px 20px 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Dark overlay -->
    <div class="overlay"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="security-icon">
                <!-- lock icon using Bootstrap icons or font-awesome -->
                <!-- If you have Font Awesome: <i class="fas fa-lock"></i> -->
                🔒
            </div>
            <h2 class="login-title">Secure Login</h2>
            <p class="login-subtitle">IDPS Admin Panel – keep your network safe 🛡️</p>

            <form method="post" action="/MyApp/adm_login_post/">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        id="username"
                        placeholder="Enter your username"
                        required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-login">
                    Login to IDPS
                </button>
            </form>

            <div class="text-center mt-3 forgot-link">
                <a href="/MyApp/web_forgetpassword/">Forgot Password?</a>
            </div>
            <div class="tiny-note">
                ⚠️ Authorized users only. All activities are monitored.
            </div>
        </div>
    </div>

    <!-- Scripts (optional for Bootstrap 4 components) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
