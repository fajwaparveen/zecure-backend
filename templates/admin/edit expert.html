<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Expert</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Add Expert</h2>
    <form method="post" action="/MyApp/adm_editexpert_post/" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" value="{{ data.id }}" name="id">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 "> Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ data.name }}" id="name" name="name" required>
        </div>
      </div>





      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" id="email" value="{{ data.emailid }}" name="email" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" id="phone" value="{{ data.phonenumber }}" name="phonenumber" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="place" value="{{ data.place }}" name="place" required>
        </div>
      </div>

    <div class="row mb-3">
        <label for="city" class="col-sm-4 ">Post</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ data.post }}" id="city" name="post" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pin code</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="pincode" value="{{ data.pincode }}" name="pincode" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">Qualification</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="qualification" value="{{ data.qualification }}" required name="qualification">
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">Experience</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="Experience" value="{{ data.experience }}" name="experience" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Upload Photo</label>
        <div class="col-sm-8">
          <input type="file" class="form-control" id="photo" name="photo" accept="image/*" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
